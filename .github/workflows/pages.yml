name: Publish dashboard
# Сторінка читає дані з Cloudflare Worker, секрети тут не потрібні.
# Публікація запускається після кожного push у main і вручну (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare page
        run: npm run build
      # Сервісний режим («технічні роботи»): змінна репозиторію REGIM_SERVICE зі значенням «+».
      # Settings -> Secrets and variables -> Actions -> Variables. Будь-яке інше значення (або змінної немає) = звичайна робота.
      # Після зміни значення запустити цей workflow вручну (Run workflow).
      - name: Service mode (technical works)
        if: vars.REGIM_SERVICE == '+'
        run: |
          sed -i 's/<html lang="uk">/<html lang="uk" data-maintenance>/' dist/index.html
          grep -q 'data-maintenance' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
